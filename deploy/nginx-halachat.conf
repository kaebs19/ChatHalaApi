# Nginx Configuration for HalaChat (دردشات)
# Location: /etc/nginx/sites-available/halachat
#
# ⚠️ هذا الملف مرآة للإعداد الحيّ على السيرفر (srv1106665) — وليس مصدره.
# لا تنسخه فوق الملف الحيّ مباشرة: أسطر Certbot تُدار آلياً وقد تتغيّر.
# طبّق التغييرات على السيرفر يدوياً ثم حدّث هذه النسخة لتبقى مطابقة.

server {
    server_name halachat.khalafiati.io;

    # لوحة تحكم الأدمن (api/frontend/build)
    root /var/www/HalaChat/frontend/build;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ⚠️ /admin/ يخدم لوحة «ماتش هلا» — مشروع مختلف عن هذا المستودع.
    # موجود في الإعداد الحيّ. راجع ما إذا كان ما زال مطلوباً.
    # location /admin/ {
    #     alias /var/www/HalaChat/admin/build/;
    #     try_files $uri $uri/ /admin/index.html;
    # }

    # Max upload size
    client_max_body_size 10M;

    # ⚠️ توثيق Swagger مكشوف للعموم — يسرد كل نقاط النهاية لأي زائر.
    # يُنصح بحصره بـ IP الإدارة أو تعطيله في الإنتاج.
    location /api-docs/ {
        proxy_pass http://127.0.0.1:5001/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Proxy - Backend
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Socket.IO Proxy
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 🔒 صور التوثيق (سيلفي/هوية) — ممنوع الوصول المباشر
    # تُقدَّم فقط عبر GET /api/verifications/file/:filename (أدمن + توكن)
    # ^~ يضمن الأولوية على location /uploads/ التالي
    location ^~ /uploads/verifications/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Uploads - Static Files
    location /uploads/ {
        alias /var/www/HalaChat/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React Router - SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── أسطر Certbot (تُدار آلياً على السيرفر) ──
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/halachat.khalafiati.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/halachat.khalafiati.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = halachat.khalafiati.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name halachat.khalafiati.io;
    return 404; # managed by Certbot
}
